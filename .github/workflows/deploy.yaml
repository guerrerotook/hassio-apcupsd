---
name: Deploy

concurrency:
  group: queue

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  release:
    types:
      - published
  workflow_dispatch:

permissions: {}

jobs:
  information:
    name: ℹ️ Gather add-on information
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      environment: ${{ steps.release.outputs.environment }}
      release_version: ${{ steps.release.outputs.release_version }}
    steps:
      - name: ℹ️ Gather environment and release version
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          environment="edge"
          release_version=""
          if [[ "${EVENT_NAME}" = "release" ]]; then
            release_version="${TAG_NAME,,}"
            release_version="${release_version#v}"
            environment="stable"
            if [[ "${IS_PRERELEASE}" = "true" ]]; then
              environment="beta"
            fi
          fi

          echo "environment=${environment}" >> "$GITHUB_OUTPUT"
          echo "release_version=${release_version}" >> "$GITHUB_OUTPUT"

  deploy:
    name: 👷 Build & Deploy ${{ matrix.addon }}
    needs: information
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        addon:
          - apcupsd
          - apcupsd_net
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: 🚀 Run add-on information action
        id: information
        uses: frenck/action-addon-information@ce1377e9851cf569c29329e65fb2c57e67ca0f69 # v1.4.2
        with:
          path: ./${{ matrix.addon }}
      - name: ℹ️ Determine the version to publish
        id: version
        env:
          ADDON_VERSION: ${{ steps.information.outputs.version }}
          RELEASE_VERSION: ${{ needs.information.outputs.release_version }}
        run: |
          version="${ADDON_VERSION}"
          if [[ -n "${RELEASE_VERSION}" ]]; then
            version="${RELEASE_VERSION}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: 🏗 Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: ℹ️ Compose build flags
        id: flags
        env:
          BUILD_FILE: ${{ steps.information.outputs.build }}
        run: |
          echo "date=$(date +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
          from=$(yq --no-colors eval ".build_from.amd64" "${BUILD_FILE}")
          echo "from=${from}" >> "$GITHUB_OUTPUT"
      - name: 🏗  Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 🚀 Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          outputs: type=image,push=true,compression=zstd,compression-level=9,force-compression=true,oci-mediatypes=true
          # yamllint disable rule:line-length
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ steps.information.outputs.slug }}:${{ needs.information.outputs.environment }}
            ghcr.io/${{ github.repository_owner }}/${{ steps.information.outputs.slug }}:${{ steps.version.outputs.version }}
          # yamllint enable rule:line-length
          # zizmor: ignore[template-injection] - path input to action, not shell-executed
          context: ${{ steps.information.outputs.target }}
          file: ${{ steps.information.outputs.target }}/Dockerfile
          cache-from: |
            type=gha,scope=${{ matrix.addon }}-amd64
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ steps.information.outputs.slug }}:edge
          cache-to: type=gha,mode=max,scope=${{ matrix.addon }}-amd64
          platforms: linux/amd64
          build-args: |
            BUILD_ARCH=amd64
            BUILD_DATE=${{ steps.flags.outputs.date }}
            BUILD_DESCRIPTION=${{ steps.information.outputs.description }}
            BUILD_FROM=${{ steps.flags.outputs.from }}
            BUILD_NAME=${{ steps.information.outputs.name }}
            BUILD_REF=${{ github.sha }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_VERSION=${{ steps.version.outputs.version }}

