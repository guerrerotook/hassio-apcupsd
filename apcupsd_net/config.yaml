---
name: APC UPS Daemon (No USB)
version: "2.2"
slug: apcupsd_net
description: View information from APC Network UPSs
url: https://github.com/guerrerotook/hassio-apcupsd/tree/master/apcupsd_net
image: ghcr.io/guerrerotook/apcupsd_net
arch:
  - amd64
startup: services
boot: auto
init: false
hassio_api: true
hassio_role: manager
map:
  - share
options:
  name: APC UPS
  cable: ether
  type: net
  device: ""
  extra: []
schema:
  name: str
  cable: str
  type: str
  device: str
  extra:
    - key: str
      val: str
ports:
  3551/tcp: 3551
